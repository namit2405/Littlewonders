<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#fffaf3">
    <title>Thank You | Little Wonders Early Learning</title>
    <link rel="shortcut icon" href="/images1/siteicon.jpeg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffaf3;color:#1c1712;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
      main{width:min(100%,640px);padding:clamp(32px,7vw,64px);border:1px solid #efe6da;border-radius:28px;background:#fff;text-align:center;box-shadow:0 24px 60px -24px rgba(60,35,5,.22)}
      .check{width:72px;height:72px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:#fff3e2;color:#e2861a;font-size:38px;font-weight:700}
      h1{margin:0;font-size:clamp(32px,6vw,48px);line-height:1.1;letter-spacing:-.04em}
      p{margin:18px 0 0;color:#4a4239;font-size:17px;line-height:1.7}
      .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
      a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:13px 22px;border:1px solid #efe6da;border-radius:999px;color:#1c1712;font-size:15px;font-weight:700;text-decoration:none}
      a.primary{border-color:#f49b29;background:#f49b29;color:#fff}
      a:hover{transform:translateY(-1px)}
      .phone{display:block;margin-top:26px;color:#7a7066;font-size:14px}
      .phone a{min-height:0;padding:0;border:0;color:#e2861a}
    </style>
  </head>
  <body>
    <main>
      <div class="check" aria-hidden="true">✓</div>
      <h1>Thank you for getting in touch!</h1>
      <p>Your form has been submitted successfully. The Little Wonders team will be in touch soon.</p>
      <div class="actions">
        <a class="primary" href="/index.html">Back to home</a>
        <a href="/our-programs.html">Explore our programs</a>
      </div>
      <span class="phone">Need help sooner? Call <a href="tel:0353179229">(03) 5317 9229</a>.</span>
    </main>
  </body>
</html>
